# Local Mickey source/evaluation operator. League and identity operations stay
# closed until Codex Odin updates the active-arm migration gate.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

# Keep this sealed source-only cycle lean and offline.
[features]
browser_use = false
browser_use_external = false
browser_use_full_cdp_access = false
computer_use = false
in_app_browser = false
multi_agent = false

[plugins."browser@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."latex@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."slack@openai-curated"]
enabled = false
