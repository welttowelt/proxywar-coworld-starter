# Codex Odin is the persistent root operator for this project.
# Hrafn and Kimi K3 Max are external collaborators, not Codex subagents.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

# ProxyWar is terminal/API/replay driven. Keep this project lean and avoid
# loading unrelated interaction surfaces. Slack remains explicitly disabled
# during the global freeze.
[plugins."browser@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."latex@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = false

[plugins."slack@openai-curated"]
enabled = false
